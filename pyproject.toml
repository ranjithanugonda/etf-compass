[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-compass"
version = "0.1.0"
description = "Rule-based automated ETF accumulation system for the Indian cash market"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "Private"}

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pandas>=2.2",
    "yfinance>=0.2",
    "anthropic>=0.49",
    "pyarrow>=18",
    "python-dateutil>=2.9",
    "redis>=5.2",
    "pyjwt>=2.10",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["backend/alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["backend/alembic/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
